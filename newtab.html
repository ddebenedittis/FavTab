<!DOCTYPE html>
<html lang="en" class="booting">
<head>
<meta charset="utf-8">
<title>New Tab</title>
<link rel="stylesheet" href="css/newtab.css">
</head>
<body>

<button id="open-settings" class="gear" type="button" title="Settings" aria-label="Settings">
  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <circle cx="12" cy="12" r="3"/>
    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
  </svg>
</button>

<div class="page">
  <nav id="breadcrumb" class="breadcrumb" aria-label="Folder path"></nav>
  <main id="grid" class="grid"></main>
  <p id="empty" class="empty" hidden>No favourites here yet — right-click or use the + tile to add one.</p>
</div>

<aside id="dock" class="dock" hidden aria-label="Dock">
  <div id="dock-grid" class="dock-grid"></div>
</aside>

<dialog id="edit-dialog">
  <form id="edit-form" method="dialog" novalidate>
    <h2 id="dialog-title">Add favourite</h2>
    <label class="field">
      <span>Name</span>
      <input name="title" type="text" autocomplete="off">
    </label>
    <label class="field" id="url-row">
      <span>URL</span>
      <input name="url" type="text" autocomplete="off" spellcheck="false" placeholder="example.com">
    </label>
    <p id="url-error" class="field-error" hidden>Enter a valid URL.</p>
    <label class="field" id="icon-row">
      <span>Icon URL</span>
      <input name="iconUrl" type="text" autocomplete="off" spellcheck="false" placeholder="leave blank to auto-detect">
    </label>
    <menu class="dialog-buttons">
      <button value="cancel" formnovalidate>Cancel</button>
      <button value="ok" class="primary" id="dialog-ok">Save</button>
    </menu>
  </form>
</dialog>

<dialog id="confirm-dialog">
  <form method="dialog">
    <p id="confirm-message"></p>
    <menu class="dialog-buttons">
      <button value="cancel" autofocus>Cancel</button>
      <button value="ok" class="danger">Delete</button>
    </menu>
  </form>
</dialog>

<dialog id="settings-dialog">
  <h2>Settings</h2>

  <div class="settings-tabs" role="tablist">
    <button type="button" class="settings-tab" data-tab="dock" role="tab" aria-selected="true">Dock</button>
    <button type="button" class="settings-tab" data-tab="appearance" role="tab" aria-selected="false">Appearance</button>
  </div>

  <form id="settings-form" method="dialog">
    <div class="settings-panel" data-panel="dock">
      <label class="field-inline">
        <span>Show dock</span>
        <input type="checkbox" name="dockEnabled">
      </label>

      <label class="field-inline" id="dock-folder-row">
        <span>Dock folder</span>
        <select name="dockFolderId"></select>
      </label>

      <label class="field-inline" id="dock-position-row">
        <span>Dock position</span>
        <select name="dockPosition">
          <option value="bottom">Bottom</option>
          <option value="top">Top</option>
          <option value="left">Left</option>
          <option value="right">Right</option>
        </select>
      </label>
    </div>

    <div class="settings-panel" data-panel="appearance" hidden>
      <label class="field-inline">
        <span>Icon size</span>
        <span class="settings-color-group">
          <input type="range" name="iconSize" min="32" max="72" step="4">
          <span class="icon-size-value" id="icon-size-value"></span>
        </span>
      </label>

      <label class="field-inline">
        <span>Icons per row</span>
        <select name="perRow">
          <option value="0">Auto</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="8">8</option>
        </select>
      </label>

      <div class="field-inline">
        <span>Background colour</span>
        <span class="settings-color-group">
          <input type="checkbox" id="bg-custom-toggle">
          <input type="color" name="bgColor" id="bg-color-input">
        </span>
      </div>

      <label class="field-inline">
        <span>Order</span>
        <select name="sortMode">
          <option value="manual">Manual (drag to reorder)</option>
          <option value="locked">Locked</option>
          <option value="alphabetical">Alphabetical (A–Z)</option>
        </select>
      </label>
    </div>

    <menu class="dialog-buttons">
      <button value="ok" class="primary">Done</button>
    </menu>
  </form>
</dialog>

<ul id="context-menu" class="context-menu" hidden></ul>
<div id="toast" class="toast" hidden></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
