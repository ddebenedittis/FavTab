<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: 'Inter', 'Cantarell', 'Ubuntu', system-ui, sans-serif;
    color: #fff;
    background:
      radial-gradient(circle at 85% 15%, rgb(255 255 255 / 0.18), transparent 45%),
      linear-gradient(135deg, #3b82f6 0%, #2563eb 55%, #1d4ed8 100%);
    display: flex;
    align-items: center;
  }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { filter: drop-shadow(0 6px 14px rgb(0 0 0 / 0.25)); border-radius: 22%; }
  h1 { font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
  p { opacity: 0.92; line-height: 1.3; }

  /* 440x280 small tile */
  body.small { justify-content: center; }
  .small .card { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 18px; }
  .small .brand img { width: 84px; height: 84px; }
  .small h1 { font-size: 52px; }
  .small p { font-size: 20px; font-weight: 500; }
  .small .shot { display: none; }

  /* 1400x560 marquee */
  body.marquee { padding-left: 110px; gap: 70px; }
  .marquee .card { flex: 0 0 470px; display: flex; flex-direction: column; gap: 26px; }
  .marquee .brand img { width: 96px; height: 96px; }
  .marquee h1 { font-size: 68px; }
  .marquee p { font-size: 28px; font-weight: 500; }
  .marquee .shot {
    width: 760px;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 30px 60px rgb(0 0 0 / 0.35);
    transform: translateY(40px);
    background: #f5f6f8;
  }
  .marquee .bar { height: 30px; background: #e3e6eb; display: flex; align-items: center; gap: 8px; padding-left: 14px; }
  .marquee .bar i { width: 11px; height: 11px; border-radius: 50%; background: #c3c8d1; }
  .marquee .shot img { display: block; width: 100%; }
</style>
</head>
<body class="__KIND__">
  <div class="card">
    <div class="brand"><img src="__ICON__" alt=""><h1>FavTab</h1></div>
    <p>Your bookmarks as a clean grid,<br>every time you open a new tab.</p>
  </div>
  <div class="shot"><div class="bar"><i></i><i></i><i></i></div><img src="__SHOT__" alt=""></div>
</body>
</html>
